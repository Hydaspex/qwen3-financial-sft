experiment_name: qwen3-4b-tatqa-lora
seed: 42

model:
  name_or_path: Qwen/Qwen3-4B-Instruct-2507
  load_in_4bit: true            # QLoRA; set false for bf16 LoRA on >=24GB
  attn_implementation: flash_attention_2
  use_cache: false

data:
  dataset_name: next-tat/TAT-QA
  train_path: data/train.jsonl  # written by scripts/prepare_data.py
  val_path: data/val.jsonl
  val_fraction: 0.05
  max_context_chars: 6000       # truncate long table+text contexts
  max_samples: null             # set e.g. 2000 for smoke runs

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

trainer:
  output_dir: outputs/qwen3-4b-tatqa-lora
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8   # effective batch 32
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  max_length: 2048
  logging_steps: 10
  save_strategy: epoch
  bf16: true
  gradient_checkpointing: true

mlflow:
  tracking_uri: null             # null -> ./mlruns; or 'databricks'
  experiment: /Shared/qwen3-financial-sft
